name: 豊肥子牛市場データ自動更新

on:
  schedule:
    # 毎月14日 午前10時（日本時間）= UTC 01:00
    - cron: '0 1 14 * *'
  workflow_dispatch:
    # 手動実行も可能

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 市場データを取得・更新
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-market.mjs

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/market-data.json
          if git diff --staged --quiet; then
            echo "データに変更なし。スキップします。"
          else
            git commit -m "🐄 豊肥子牛市場データ自動更新 $(date '+%Y年%m月')"
            git push origin HEAD
          fi

      - name: アプリをビルド
        run: npm run build

      - name: GitHub Pages にデプロイ
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
